[package]
name = "papertrading"
description = "Application de bureau PaperTrading (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
pt-core.workspace = true
pt-data.workspace = true
pt-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
# Gestionnaire d'identification de Windows : rangement chiffré des clés d'API (src/accounts.rs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
